name: My First GitHub Actions Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:v7 .
          echo "Pushing Docker image to Docker Hub..."
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:v7

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
         image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:v7
         format: table
         severity: CRITICAL,HIGH
         exit-code: 0
    
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name nana --region us-west-1

      - name: Deploy to EKS
        run: |
          kubectl apply -f  deployment.yaml --validate=false